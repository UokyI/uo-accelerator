name: Build & Release

# 推送 v 开头的 tag（如 v1.0.0）时触发
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 编译
        run: go build -ldflags="-s -w" -o uo-accelerator.exe .

      - name: 组装发布包
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item uo-accelerator.exe release\
          Copy-Item config.yaml release\
          Compress-Archive -Path release\* -DestinationPath "uo-accelerator_${{ github.ref_name }}.zip" -Force

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: uo-accelerator_${{ github.ref_name }}.zip
          generate_release_notes: true
