# ============================================================
# GitHub Accelerator 配置文件
# ============================================================

# 本地代理监听地址
listen: ":9910"

# DNS over HTTPS 端点（用于获取未被污染的 GitHub IP）
doh:
  - "https://dns.alidns.com/resolve"
  - "https://doh.pub/dns-query"

# 需要加速的 GitHub 域名
domains:
  - github.com
  - api.github.com
  - codeload.github.com
  - gist.github.com
  - raw.githubusercontent.com
  - objects.githubusercontent.com
  - release-assets.githubusercontent.com
  - github-releases.githubusercontent.com
  - media.githubusercontent.com
  - user-images.githubusercontent.com
  - avatars.githubusercontent.com
  - camo.githubusercontent.com
  - github.githubassets.com
  - collector.github.com

# 前缀代理规则：指定域名走镜像站加速
# {url} 会被替换为原始完整 URL
# 留空或不配置 = 走最优 IP 直连
prefixes: {}

# 测速用的测试 URL 路径（用于实际下载测速）
probe_paths:
  - "/favicon.ico"
  - "/"

# 探测间隔（格式: 数字 + 单位 s/m/h）
probe_interval: "5m"

# 单次探测超时
probe_timeout: "3s"

# 每个域名保留的最快 IP 数量
top_n: 3
